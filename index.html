<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Homerun Hero</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ── HUD 頂部細條（只剩標題 + 好壞球）── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 10; pointer-events: none;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    #hud-top {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0,0,0,0.75); padding: 8px 16px; gap: 12px;
    }

    #hud-title {
      font-size: 13px; color: #ffcc00; letter-spacing: 2px;
      font-weight: 900; white-space: nowrap;
    }

    #hud-count-area {
      display: flex; gap: 20px; align-items: center;
    }

    .count-block {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }

    .count-label {
      font-size: 11px; color: #bbb; letter-spacing: 1px; font-weight: bold;
    }

    .dot-row {
      display: flex; gap: 6px; align-items: center;
    }

    /* 放大點點 */
    .count-dot {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid #555; background: transparent;
      transition: background 0.1s, border-color 0.1s;
    }

    .count-dot.out-dot.active    { background: #ff4444; border-color: #ff6666; box-shadow: 0 0 6px #ff4444; }
    .count-dot.strike-dot.active { background: #ffcc00; border-color: #ffdd44; box-shadow: 0 0 6px #ffcc00; }
    .count-dot.ball-dot.active   { background: #44cc44; border-color: #66dd66; box-shadow: 0 0 6px #44cc44; }

    /* ── 壘包圖示（放大，右下角）── */
    #hud-bases-wrap {
      position: fixed; bottom: 40px; right: 16px; pointer-events: none;
    }

    #hud-bases { position: relative; width: 104px; height: 104px; }

    .base-diamond {
      position: absolute; width: 32px; height: 32px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.4);
      transform: rotate(45deg);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .base-diamond.occupied {
      background: #ffcc00;
      border-color: #ffaa00;
      box-shadow: 0 0 12px #ffcc00;
    }

    /* 菱形排列 */
    #base-2    { top: 2px;  left: 36px; }
    #base-1    { top: 36px; left: 70px; }
    #base-3    { top: 36px; left: 2px;  }
    #base-home { top: 70px; left: 36px; opacity: 0.35; }

    /* ── 底部統計 ── */
    #hud-bottom {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: center; gap: 24px;
      background: rgba(0,0,0,0.65); padding: 6px 0;
      font-size: 13px; color: #ccc;
      font-family: 'Arial Black', Arial, sans-serif;
      pointer-events: none;
    }

    /* ── 結果 flash 顏色 ── */
    .ball-flash { color: #44cc00 !important; }
    .out        { color: #ff4444 !important; }

    /* ── 標題畫面規則說明 ── */
    .sub-rules {
      font-size: 13px; color: #aaa; margin: 8px 0 14px;
      line-height: 1.8; text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- HUD 頂部：標題 + 出局/好球/壞球 -->
  <div id="hud">
    <div id="hud-top">
      <div id="hud-title">HOMERUN HERO</div>

      <div id="hud-count-area">
        <!-- 出局 -->
        <div class="count-block">
          <div class="count-label">出局</div>
          <div class="dot-row" id="hud-outs"></div>
        </div>

        <!-- 好球 -->
        <div class="count-block">
          <div class="count-label">好球</div>
          <div class="dot-row" id="hud-strikes"></div>
        </div>

        <!-- 壞球 -->
        <div class="count-block">
          <div class="count-label">壞球</div>
          <div class="dot-row" id="hud-balls"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 壘包圖示（左下角，放大）-->
  <div id="hud-bases-wrap">
    <div id="hud-bases">
      <div id="base-2"    class="base-diamond"></div>
      <div id="base-1"    class="base-diamond"></div>
      <div id="base-3"    class="base-diamond"></div>
      <div id="base-home" class="base-diamond"></div>
    </div>
  </div>

  <!-- 底部統計 -->
  <div id="hud-bottom">
    <span id="hud-hits">安打: 0</span>
    <span id="hud-hr">全壘打: 0</span>
    <span id="hud-best">最遠: 0 ft</span>
  </div>

  <!-- 隱藏的元素讓 hud.js 不出錯（局數/得分仍需 id）-->
  <span id="hud-inning"  style="display:none">1</span>
  <span id="hud-score"   style="display:none">0</span>

  <!-- Pitch tracking overlay -->
  <div id="pitch-tracker">
    <canvas id="pitch-tracker-canvas"></canvas>
  </div>

  <!-- Pitch info flash -->
  <div id="pitch-info"></div>

  <!-- Result overlay -->
  <div id="result-overlay" class="hidden">
    <div id="result-type"></div>
    <div id="result-stats"></div>
  </div>

  <!-- Title screen -->
  <div id="title-screen">
    <h1>HOMERUN HERO</h1>
    <p>點擊 / 點按瞄準揮棒！</p>
    <div class="sub-rules">
      ⚾ 3 好球三振・4 壞球保送<br>
      3 出局換局・共 9 局・累積得分
    </div>
    <div id="difficulty-selector">
      <div class="diff-btn selected" data-diff="easy">EASY</div>
      <div class="diff-btn" data-diff="normal">NORMAL</div>
      <div class="diff-btn" data-diff="hard">HARD</div>
    </div>
    <div class="start-btn">TAP TO START</div>
  </div>

  <!-- Game over screen -->
  <div id="game-over" class="hidden">
    <h1>GAME OVER</h1>
    <div id="final-stats"></div>
    <div id="leaderboard"></div>
    <div class="start-btn">TAP TO PLAY AGAIN</div>
    <div class="menu-btn" id="gameover-menu">MAIN MENU</div>
  </div>

  <!-- Pause screen -->
  <div id="pause-screen" class="hidden">
    <h1>PAUSED</h1>
    <div class="pause-btn" id="pause-resume">RESUME</div>
    <div class="pause-btn" id="pause-restart">RESTART</div>
    <div class="pause-btn" id="pause-menu">MAIN MENU</div>
  </div>

  <div id="version">v2.1.0</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
